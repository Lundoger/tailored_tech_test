# Local Postgres for development; production runs on Supabase.
# Port 5433 avoids colliding with a Postgres already installed on the host.
services:
  postgres:
    image: postgres:17-alpine
    container_name: data-room-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_room
    ports:
      - '5433:5432'
    volumes:
      - data-room-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d data_room']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  data-room-postgres:
