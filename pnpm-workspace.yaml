packages:
  - apps/*
  - packages/*

# pnpm blocks dependency lifecycle scripts by default. These six need theirs:
# Prisma downloads/places its query engine, SWC and esbuild unpack a prebuilt
# native binary, unrs-resolver backs the ESLint import resolver, and @scarf/scarf
# is a telemetry no-op that fails loudly if blocked.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# pnpm records freshly-published versions it would otherwise hold back under its
# minimum-release-age policy. Pinned deliberately: this project targets the
# current Next 16 / Nest 11 / Prisma 7 line.
minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.8.0'
  - '@nestjs/common@11.2.0'
  - '@nestjs/core@11.2.0'
  - '@nestjs/platform-express@11.2.0'
  - '@nestjs/testing@11.2.0'
  - '@next/env@16.3.1'
  - '@next/eslint-plugin-next@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - eslint-config-next@16.3.1
  - next@16.3.1
  - turbo@2.10.10
